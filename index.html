<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Семейный Бюджет</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="p-4 pb-24">
  <!-- Шапка -->
  <div class="flex justify-between items-center mb-5">
    <div>
      <h1 class="text-xl font-bold">Семейный Бюджет ₸</h1>
      <p id="user-greeting" class="text-xs text-slate-400">Семейный доступ: Загрузка...</p>
    </div>
    <span id="current-date-badge" class="text-xs px-2.5 py-1 bg-slate-800 rounded-full border border-slate-700 text-slate-300 font-medium">Сегодня</span>
  </div>

  <!-- Карточки баланса -->
  <div class="grid grid-cols-2 gap-3 mb-5">
    <div class="bg-slate-800/50 p-3.5 rounded-2xl border border-emerald-500/20">
      <span class="text-xs text-emerald-400 font-medium">Доходы</span>
      <p id="total-income" class="text-lg font-bold text-emerald-400 mt-1">0 ₸</p>
    </div>
    <div class="bg-slate-800/50 p-3.5 rounded-2xl border border-rose-500/20">
      <span class="text-xs text-rose-400 font-medium">Расходы</span>
      <p id="total-expense" class="text-lg font-bold text-rose-400 mt-1">0 ₸</p>
    </div>
  </div>

  <!-- Круговая диаграмма реальных категорий -->
  <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700 mb-5">
    <h3 class="text-xs font-semibold text-slate-300 mb-3 uppercase tracking-wider">Структура расходов</h3>
    <div class="relative h-48 flex justify-center items-center">
      <canvas id="categoryChart"></canvas>
    </div>
  </div>

  <!-- Блок ИИ-Аналитики Gemini -->
  <div class="bg-gradient-to-br from-indigo-950/60 to-slate-900 p-4 rounded-2xl border border-indigo-500/30 mb-5">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-2">
        <span class="text-base">🤖</span>
        <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider">Совет от Gemini ИИ</h3>
      </div>
      <button onclick="requestAiAdvice()" id="ai-btn" class="text-[11px] px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-medium transition-all">Обновить</button>
    </div>
    <p id="ai-text" class="text-xs leading-relaxed text-slate-300">
      Нажмите кнопку «Обновить», чтобы получить экспресс-анализ бюджета от Gemini на основе реальных данных из таблицы.
    </p>
  </div>

  <!-- Последние операции -->
  <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700 mb-5">
    <h3 class="text-xs font-semibold text-slate-300 mb-3 uppercase tracking-wider">Последние операции</h3>
    <div id="recent-list" class="space-y-2.5 text-xs">
      <p class="text-slate-500 text-center py-2">Загрузка данных...</p>
    </div>
  </div>

  <!-- Форма внесения операции -->
  <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
    <h3 class="text-xs font-semibold text-slate-300 mb-3 uppercase tracking-wider">Внести операцию</h3>
    
    <div class="flex gap-2 mb-3">
      <button type="button" id="type-exp" onclick="setType('Расход')" class="flex-1 py-2 text-xs font-bold rounded-xl bg-rose-600 text-white">Расход</button>
      <button type="button" id="type-inc" onclick="setType('Доход')" class="flex-1 py-2 text-xs font-bold rounded-xl bg-slate-700 text-slate-300">Доход</button>
    </div>

    <input type="number" id="inp-amount" placeholder="Сумма (₸)" inputmode="numeric" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-base font-bold text-white mb-2 focus:outline-none focus:border-blue-500">
    
    <select id="inp-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white mb-2 focus:outline-none focus:border-blue-500">
      <option value="Продукты">🛒 Продукты</option>
      <option value="Коммуналка">🏠 Коммуналка</option>
      <option value="Транспорт">🚗 Транспорт / Такси</option>
      <option value="Дети">👶 Дети (Назар)</option>
      <option value="Кафе">☕ Кафе и Рестораны</option>
      <option value="Здоровье">💊 Здоровье</option>
      <option value="Техника">📷 Оборудование / Техника</option>
      <option value="Прочее">📦 Прочее</option>
    </select>

    <input type="text" id="inp-desc" placeholder="Описание (необязательно)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white mb-3 focus:outline-none focus:border-blue-500">

    <button onclick="submitForm()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all">Записать в таблицу</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const userName = tg?.initDataUnsafe?.user?.first_name || 'Данат';
    document.getElementById('user-greeting').innerText = `Семейный доступ: ${userName}`;

    // Отображение сегодняшней даты в шапке
    const now = new Date();
    const dateFormatted = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    document.getElementById('current-date-badge').innerText = dateFormatted;

    let currentType = 'Расход';

    // ВСТАВЬТЕ СЮДА ВАШ WEBHOOK URL ИЗ n8n
    const N8N_GET_DATA_URL = 'ВСТАВИТЬ_ССЫЛКУ_ИЗ_ШАГА_1';

    // Инициализация пустой диаграммы
    const ctxCat = document.getElementById('categoryChart').getContext('2d');
    const categoryChart = new Chart(ctxCat, {
      type: 'doughnut',
      data: {
        labels: ['Нет данных'],
        datasets: [{
          data: [1],
          backgroundColor: ['#334155'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, color: '#94a3b8', font: { size: 10 } } }
        },
        cutout: '70%'
      }
    });

    // Функция загрузки реальных данных из таблицы через n8n
    async function loadRealData() {
      if (N8N_GET_DATA_URL.includes('ВСТАВИТЬ_ССЫЛКУ')) return;

      try {
        const res = await fetch(N8N_GET_DATA_URL);
        const data = await res.json();

        // 1. Обновление баланса
        document.getElementById('total-income').innerText = `+${Number(data.totalIncome).toLocaleString('ru-RU')} ₸`;
        document.getElementById('total-expense').innerText = `-${Number(data.totalExpense).toLocaleString('ru-RU')} ₸`;

        // 2. Обновление диаграммы категорий
        const catLabels = Object.keys(data.categories);
        const catValues = Object.values(data.categories);

        if (catLabels.length > 0) {
          categoryChart.data.labels = catLabels;
          categoryChart.data.datasets[0].data = catValues;
          categoryChart.data.datasets[0].backgroundColor = [
            '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4', '#e11d48'
          ];
          categoryChart.update();
        }

        // 3. Вывод последних 5 транзакций
        const listEl = document.getElementById('recent-list');
        listEl.innerHTML = '';

        if (!data.recent || data.recent.length === 0) {
          listEl.innerHTML = '<p class="text-slate-500 text-center py-2">Транзакций пока нет</p>';
        } else {
          data.recent.forEach(t => {
            const isInc = t.type === 'Доход';
            const sign = isInc ? '+' : '-';
            const colorClass = isInc ? 'text-emerald-400' : 'text-slate-200';

            const item = document.createElement('div');
            item.className = 'flex justify-between items-center py-1.5 border-b border-slate-700/50 last:border-0';
            item.innerHTML = `
              <div>
                <p class="font-medium text-white">${t.cat} <span class="text-slate-500 text-[10px]">(${t.who})</span></p>
                <p class="text-slate-400 text-[10px]">${t.desc || t.date}</p>
              </div>
              <span class="font-bold ${colorClass}">${sign}${Number(t.amount).toLocaleString('ru-RU')} ₸</span>
            `;
            listEl.appendChild(item);
          });
        }
      } catch (err) {
        console.error('Ошибка загрузки данных:', err);
      }
    }

    loadRealData();

    function setType(type) {
      currentType = type;
      const bExp = document.getElementById('type-exp');
      const bInc = document.getElementById('type-inc');
      if (type === 'Расход') {
        bExp.className = 'flex-1 py-2 text-xs font-bold rounded-xl bg-rose-600 text-white';
        bInc.className = 'flex-1 py-2 text-xs font-bold rounded-xl bg-slate-700 text-slate-300';
      } else {
        bInc.className = 'flex-1 py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white';
        bExp.className = 'flex-1 py-2 text-xs font-bold rounded-xl bg-slate-700 text-slate-300';
      }
    }

    function requestAiAdvice() {
      const btn = document.getElementById('ai-btn');
      btn.innerText = 'Запрос...';
      btn.disabled = true;

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({ action: "get_ai_report" }));
        tg.close();
      }
    }

    function submitForm() {
      const amount = document.getElementById('inp-amount').value;
      const category = document.getElementById('inp-category').value;
      const description = document.getElementById('inp-desc').value;

      if (!amount) {
        if (tg) tg.showAlert("Укажите сумму!");
        return;
      }

      const payload = {
        action: "add_transaction",
        type: currentType,
        amount: Number(amount),
        category: category,
        description: description,
        user_name: userName
      };

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      }
    }
  </script>
</body>
</html>
