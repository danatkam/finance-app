<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейный Бюджет</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
        }
        .type-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .type-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #000000);
            cursor: pointer;
            font-size: 16px;
        }
        .active-btn {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border-color: var(--tg-theme-button-color, #3390ec);
        }
    </style>
</head>
<body>
    <h2 id="greeting">Привет!</h2>
    
    <div class="type-switch">
        <button type="button" id="btn-expense" class="type-btn active-btn" onclick="setType('Расход')">Расход</button>
        <button type="button" id="btn-income" class="type-btn" onclick="setType('Доход')">Доход</button>
    </div>

    <input type="number" id="amount" placeholder="Сумма (₸)" inputmode="numeric" required>
    
    <select id="category">
        <option value="Продукты">Продукты</option>
        <option value="Коммуналка">Коммуналка</option>
        <option value="Транспорт">Транспорт</option>
        <option value="Развлечения">Развлечения</option>
        <option value="Дети">Дети</option>
        <option value="Прочее">Прочее</option>
    </select>

    <input type="text" id="description" placeholder="Описание (необязательно)">

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачивает окно на весь экран Telegram

        let currentType = 'Расход';
        
        // Автоматически берет имя из Telegram (ваше или Zaituna)
        let userName = tg.initDataUnsafe?.user?.first_name || 'Семья';
        document.getElementById('greeting').innerText = 'Привет, ' + userName + '!';

        function setType(type) {
            currentType = type;
            if(type === 'Расход') {
                document.getElementById('btn-expense').classList.add('active-btn');
                document.getElementById('btn-income').classList.remove('active-btn');
            } else {
                document.getElementById('btn-income').classList.add('active-btn');
                document.getElementById('btn-expense').classList.remove('active-btn');
            }
        }

        // Включение главной кнопки Telegram внизу экрана
        tg.MainButton.setText('СОХРАНИТЬ');
        tg.MainButton.show();

        // Отправка данных в n8n при нажатии
        tg.MainButton.onClick(function() {
            let amount = document.getElementById('amount').value;
            let category = document.getElementById('category').value;
            let description = document.getElementById('description').value;

            if (!amount) {
                tg.showAlert('Введите сумму!');
                return;
            }

            let data = {
                type: currentType,
                amount: amount,
                category: category,
                description: description,
                user_name: userName
            };

            // Отправляем JSON обратно в бота
            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
